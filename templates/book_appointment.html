{% extends "base.html" %}

{% block title %}
Book Appointment
{% endblock %}

{% block content %}

<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card p-4">

                <h2 class="text-primary text-center mb-4">
                    Book an Appointment
                </h2>


                <form
                    method="POST"
                    action="{{ url_for('book_appointment') }}"
                >

                    <div class="mb-3">

                        <label class="form-label">
                            Select Doctor
                        </label>

                        <select
                            name="doctor_email"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select a doctor
                            </option>

                            {% for doctor in doctors %}

                            <option value="{{ doctor['email'] }}">

                                Dr. {{ doctor['name'] }}
                                - {{ doctor['email'] }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Appointment Date
                            </label>

                            <input
                                type="date"
                                name="appointment_date"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Appointment Time
                            </label>

                            <input
                                type="time"
                                name="appointment_time"
                                class="form-control"
                                required
                            >

                        </div>

                    </div>


                    <div class="mb-4">

                        <label class="form-label">
                            Symptoms / Reason for Visit
                        </label>

                        <textarea
                            name="symptoms"
                            class="form-control"
                            rows="5"
                            placeholder="Describe your symptoms..."
                            required
                        ></textarea>

                    </div>


                    <div class="d-flex justify-content-between">

                        <a
                            href="{{ url_for('dashboard') }}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Book Appointment
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
