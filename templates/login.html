{% extends "base.html" %}

{% block title %}
MedTrack - Login
{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card p-4 mt-5 mb-5">

                <h2 class="text-center text-primary mb-4">
                    Login to MedTrack
                </h2>


                <form method="POST"
                      action="{{ url_for('login') }}">

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <div class="mb-4">

                        <label class="form-label">
                            Login As
                        </label>

                        <select
                            name="role"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Role
                            </option>

                            <option value="patient">
                                Patient
                            </option>

                            <option value="doctor">
                                Doctor
                            </option>

                        </select>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Login
                    </button>

                </form>


                <p class="text-center mt-4 mb-0">

                    Don't have an account?

                    <a href="{{ url_for('register') }}">
                        Register here
                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
