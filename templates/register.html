{% extends "base.html" %}

{% block title %}
MedTrack - Register
{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-7 col-lg-6">

            <div class="card p-4 mt-5 mb-5">

                <h2 class="text-center text-primary mb-4">
                    Create Your Account
                </h2>

                <form method="POST"
                      action="{{ url_for('register') }}">

                    <div class="mb-3">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="Enter your name"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Age
                        </label>

                        <input
                            type="number"
                            name="age"
                            class="form-control"
                            min="1"
                            max="120"
                            placeholder="Enter your age"
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Create a password"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            name="confirm_password"
                            class="form-control"
                            placeholder="Confirm your password"
                            required
                        >

                    </div>


                    <div class="mb-4">

                        <label class="form-label">
                            Register As
                        </label>

                        <select
                            name="role"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Role
                            </option>

                            <option value="patient">
                                Patient
                            </option>

                            <option value="doctor">
                                Doctor
                            </option>

                        </select>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Register
                    </button>

                </form>


                <p class="text-center mt-4 mb-0">

                    Already have an account?

                    <a href="{{ url_for('login') }}">
                        Login here
                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
